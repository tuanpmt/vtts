[project]
name = "vtts"
version = "0.3.2"
description = "Tiny Vietnamese text-to-speech: front-end, distillation pipeline, C runtime for ESP32-P4"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "pyarrow>=15",
    "huggingface_hub>=0.24",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.3",
    "torchaudio>=2.3",
    "transformers>=4.44",
    "torchmetrics[audio]>=1.4",
    "onnxruntime>=1.18",
    "librosa>=0.10",
    "requests>=2.31",
    "datasets>=5.2.0",
    "pyworld>=0.3.5",
    "setuptools<81",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pyserial>=3.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vtts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: needs heavy models (torch, ASR, MOS)"]

[tool.ruff]
line-length = 100
